[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacspace-sdk"
version = "0.1.2"
description = "Official PacSpace Balance API SDK for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "PacSpace" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PacSpace/python-sdk"
Repository = "https://github.com/PacSpace/python-sdk"
Issues = "https://github.com/PacSpace/python-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pacspace_sdk*"]
